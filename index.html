<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8ea67f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>English Tracker</title>
<style>
:root{--bg:#8ea67f;--card:#f5f8ef;--ink:#1b2b27;--mute:#6b7a75;--line:#dde3de;--acc:#1f7a4d;--m:#d64545;--mu:#3f9ad8;--w:#e98a2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 18px}
.sub{color:#162812;margin:0 0 20px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.head h2{font-size:18px;margin:0;text-transform:capitalize}
button.nav{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:13px;padding:4px 0}
.day{aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.day.empty{visibility:hidden}
.day.done{background:#e3f1e9;border-color:#b7d9c5}
.day.today{outline:2px solid var(--acc)}
.day.has{color:var(--ink);font-weight:700;border-color:rgba(0,0,0,.1)}
.day.sel{box-shadow:0 0 0 3px var(--ink)}
.dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cat{border-radius:10px;padding:12px;margin-bottom:10px}
.cat label.t{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.cat input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.row{display:flex;gap:8px;margin-top:8px}
input[type=text],input[type=number]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}
input[type=number]{width:84px}
.row input[type=text]{flex:1}
.hint{color:var(--mute);font-size:14px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.words li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.words ul{list-style:none;margin:12px 0 0;padding:0}
.words small{color:var(--mute)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px}
.foot{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
input[type=date]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.dream{margin-bottom:20px;border-left:5px solid var(--acc)}
.bar{height:12px;background:#e6ebe7;border-radius:6px;overflow:hidden;margin:12px 0}
.fill{height:100%;background:linear-gradient(90deg,#1f7a4d,#e6a23c);width:0;transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);color:var(--mute)}
.chip.ok{background:#e3f1e9;border-color:#b7d9c5;color:var(--acc);font-weight:600}
#dNext{margin:10px 0 0;font-weight:600}
.land{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.land .pic{flex:0 0 55%}
.land svg{width:100%;height:auto;display:block;border-radius:10px}
.land h3{margin:0 0 6px;font-size:20px}
.land p{margin:0 0 14px;color:var(--mute)}
.land .ctl{display:flex;gap:8px;align-items:center}
.pips{display:flex;gap:6px;margin-left:8px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--acc)}
@media(max-width:760px){.land{flex-direction:column;align-items:stretch}.land .pic{flex:none}}
.land img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:#cfdcc5}
.land a{color:var(--acc)}
.land p{font-size:16px}
.warn{background:#f6dcd2;border:1px solid #e3b4a4;border-left:5px solid #c4452d;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-weight:600;color:#6b1f12}
.stat.bad{background:#f6dcd2;border-color:#e3b4a4}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.modes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.mode{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font:inherit}
.mode.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fc{min-height:200px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:42px;font-weight:700;cursor:pointer;text-align:center;padding:20px;margin:14px 0}
.fc.back{background:#e3f1e9}
.fc small{font-size:13px;font-weight:400;color:var(--mute)}
.trbtns{display:flex;gap:10px;justify-content:center}
.trq{font-size:44px;font-weight:700;text-align:center;margin:20px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer}
.okopt{background:#cfe9d6;border-color:#7fbf92}.badopt{background:#f3d3d3;border-color:#d99}
.okt{color:#1f7a4d;font-weight:600}.badt{color:#b03030;font-weight:600}
#trBody .row{justify-content:center;margin-bottom:8px}#trBody .row input[type=text]{max-width:420px}
@media(max-width:600px){.opts{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{min-height:120px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.tile:hover{background:#e3f1e9}
.counts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.cnt{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:110px}
.cbtn{width:100%;padding:14px 22px;font-size:20px}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.short{font-size:11px;color:var(--mute);text-align:center}
.trhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.selopt{background:#dfe9f5;border-color:#7fa6d4}
.news{display:flex;justify-content:space-between;gap:12px;background:#e3f1e9;border:1px solid #b7d9c5;border-left:5px solid var(--acc);border-radius:10px;padding:12px 16px;margin-bottom:20px}
@media(max-width:600px){.wrap{padding:16px 12px calc(40px + env(safe-area-inset-bottom))}h1{font-size:22px}.stat{flex:1 1 calc(50% - 12px)}.tile{min-height:90px;font-size:18px}.fc,.trq{font-size:34px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>English Tracker</h1>

  <div class="stats">
    <div class="stat"><b id="sMissed">0</b><span>дней пропущено</span></div>
    <div class="stat"><b id="sMonth">0</b><span>дней в этом месяце</span></div>
    <div class="stat"><b id="sTotal">0</b><span>дней всего</span></div>
    <div class="stat"><b id="sWords">0</b><span>слов в словаре</span></div>
  </div>

  <div class="warn" id="warn" hidden></div>

  <div class="news" id="news" hidden><span><b>Новые слова недели.</b><span id="newsList"></span></span><button class="x" id="newsX" aria-label="Закрыть">×</button></div>

  <div class="panel dream" hidden>
    <div class="row" style="margin-top:0">
      <input type="text" id="dText" placeholder="Моя мечта">
      <input type="date" id="dDate" title="К какой дате хочу приехать">
    </div>
    <p class="hint" id="dLeft"></p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="chips" id="chips"></div>
    <p id="dNext"></p>
  </div>

  <div class="panel land">
    <div class="pic" id="pic"></div>
    <div>
      <h3 id="lTitle"></h3>
      <p id="lText"></p>
      <div id="pips"></div>
      </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="cal">Календарь</button>
    <button class="tab" data-tab="words">Слова</button>
    <button class="tab" data-tab="movies">Фильмы</button>
  </div>

  <div id="calTab" class="grid">
    <div class="panel">
      <div class="head">
        <button class="nav" id="prev" aria-label="Предыдущий месяц">‹</button>
        <h2 id="title"></h2>
        <button class="nav" id="next" aria-label="Следующий месяц">›</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="panel" id="dayPanel"></div>
  </div>

  <div id="moviesTab" class="panel words" hidden>
    <div class="row" style="margin-top:0">
      <input type="text" id="mTitle" placeholder="Фильм, который посмотрел на английском">
      <input type="date" id="mDate">
      <button class="btn" id="mAdd">Добавить</button>
    </div>
    <ul id="mList"></ul>
    <p class="hint" id="mEmpty">Пока пусто. Добавь фильм здесь или впиши его в карточке дня в календаре.</p>
  </div>

  <div id="wordsTab" class="panel words" hidden>
    <div class="modes">
      <button class="mode on" data-wv="dict">Словарь</button>
      <button class="mode" data-wv="train">Тренажёр</button>
    </div>
    <div id="wDict">
    <div class="row" style="margin-top:0">
      <input type="text" id="wEn" placeholder="Слово или фраза (English)">
      <input type="text" id="wRu" placeholder="Перевод">
      <button class="btn" id="wAdd">Добавить</button>
    </div>
    <ul id="wList"></ul>
    <p class="hint" id="wEmpty">Пока пусто. Добавь первое слово, например: laundering — отмывание.</p>
    </div>
    <div id="wTrain" hidden><div id="trBody"></div></div>
  </div>

  <div class="foot">
    <button class="btn ghost" id="exp">Сохранить копию данных</button>
    <button class="btn ghost" id="imp">Загрузить копию</button>
    <button class="btn ghost" id="tst">Проверить уведомление</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</div>

<script>
const CATS=[
  {id:'movies',name:'Фильмы',color:'#f3dada',pale:'#f3dada'},
  {id:'murphy',name:'Мерфи',color:'#d9e9f5',pale:'#d9e9f5'},
  {id:'words',name:'Слова',color:'#f6e4d0',pale:'#f6e4d0'}
];
const KEY='english-tracker-v1';
let S={days:{},words:[],movies:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.days=S.days||{};S.words=S.words||[];S.movies=S.movies||[];S.score=S.score||{};
S.dream=S.dream||{text:'Работать в Дублине в сфере борьбы с финансовыми преступлениями',date:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let today=ymd(new Date());
let view=new Date();view.setDate(1);
let sel=today;

const isDone=k=>{const d=S.days[k];return !!d&&CATS.some(c=>d[c.id]&&d[c.id].on)};

function getMissed(){
  const last=Object.keys(S.days).filter(k=>k<=today&&isDone(k)).sort().pop();
  if(!last)return 0;
  return Math.max(0,Math.round((new Date(today+'T00:00')-new Date(last+'T00:00'))/864e5)-1);
}
function stats(){
  const missed=getMissed();
  const LIMIT=2,bad=missed>=LIMIT;
  $('sMissed').parentElement.classList.toggle('bad',bad);
  const w=$('warn');w.hidden=!bad;
  w.textContent=missed===LIMIT?'⚠ Уже '+missed+' дня без занятий. Сегодня третий день, позанимайся хотя бы 15 минут.':'⚠ Лимит превышен: '+missed+' дн. без занятий. Позанимайся сегодня и верни ритм.';
  const ym=view.getFullYear()+'-'+pad(view.getMonth()+1);
  const month=Object.keys(S.days).filter(k=>k.startsWith(ymd(new Date()).slice(0,7))&&isDone(k)).length;
  const total=Object.keys(S.days).filter(isDone).length;
  $('sMissed').textContent=missed;$('sMonth').textContent=month;
  $('sTotal').textContent=total;$('sWords').textContent=S.words.length;
  drawDream();
}

function drawCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $('title').textContent=view.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<first;i++)h+='<button class="day empty" tabindex="-1"></button>';
  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d),e=S.days[k]||{};
    const cols=CATS.filter(c=>e[c.id]&&e[c.id].on).map(c=>c.color);
    let bg='';
    if(cols.length===1)bg=cols[0];
    else if(cols.length>1){const w=100/cols.length;bg='linear-gradient(135deg,'+cols.map((c,i)=>`${c} ${i*w}% ${(i+1)*w}%`).join(',')+')'}
    h+=`<button class="day${cols.length?' has':''}${k===today?' today':''}${k===sel?' sel':''}" data-k="${k}"${bg?` style="background:${bg}"`:''}>${d}</button>`;
  }
  $('cal').innerHTML=h;
  $('cal').querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;drawCal();drawDay()});
}

function drawDay(){
  const e=S.days[sel]||{};
  const label=new Date(sel+'T00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('dayPanel').innerHTML=`<div class="head"><h2>${label}</h2></div>`+
    CATS.map(c=>{const v=e[c.id]||{};return `<div class="cat" style="background:${c.pale}">
      <label class="t"><input type="checkbox" data-c="${c.id}" ${v.on?'checked':''}>${c.name}</label>
      <div class="row">
        <input type="number" min="0" placeholder="мин" data-m="${c.id}" value="${v.min||''}">
        <input type="text" placeholder="${c.id==='movies'?'Что смотрел':c.id==='murphy'?'Какой юнит':'Что учил'}" data-n="${c.id}" value="${(v.note||'').replace(/"/g,'&quot;')}">
      </div></div>`}).join('');
  const upd=(id,f)=>{S.days[sel]=S.days[sel]||{};S.days[sel][id]=S.days[sel][id]||{};f(S.days[sel][id]);save();stats();drawCal()};
  $('dayPanel').querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>upd(i.dataset.c,o=>o.on=i.checked));
  $('dayPanel').querySelectorAll('[data-m]').forEach(i=>i.oninput=()=>upd(i.dataset.m,o=>{o.min=i.value;if(i.value&&!o.on){o.on=true;drawDay()}}));
  $('dayPanel').querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{
    const id=i.dataset.n;
    upd(id,o=>{o.note=i.value;if(i.value.trim()&&!o.on){o.on=true;const cb=$('dayPanel').querySelector('[data-c="'+id+'"]');if(cb)cb.checked=true}});
    syncDay(sel);
  });
}

const items=(arr)=>arr.map((x,i)=>({x,i})).sort((p,q)=>q.x.d<p.x.d?-1:q.x.d>p.x.d?1:q.i-p.i);
function drawWords(){
  $('wList').innerHTML=items(S.words).map(({x:w,i})=>
    `<li><span><b>${esc(w.en)}</b>${w.ru?' — '+esc(w.ru):''}<br><small>${w.d}</small></span><button class="x" data-i="${i}" aria-label="Удалить">×</button></li>`).join('');
  $('wEmpty').hidden=S.words.length>0;
  $('wList').querySelectorAll('.x').forEach(b=>b.onclick=()=>{S.words.splice(+b.dataset.i,1);save();drawWords();stats()});
}
function drawMovies(){
  $('mList').innerHTML=items(S.movies).map(({x:m,i})=>
    `<li><span><b>${esc(m.title)}</b><br><small>${m.d}</small></span><button class="x" data-i="${i}" aria-label="Удалить">×</button></li>`).join('');
  $('mEmpty').hidden=S.movies.length>0;
  $('mList').querySelectorAll('.x').forEach(b=>b.onclick=()=>{S.movies.splice(+b.dataset.i,1);save();drawMovies()});
}
function syncDay(k){
  const e=S.days[k]||{},parts=t=>(t||'').split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean);
  S.movies=S.movies.filter(m=>m.src!=='day:'+k);
  S.words=S.words.filter(w=>w.src!=='day:'+k);
  parts(e.movies&&e.movies.note).forEach(t=>S.movies.push({title:t,d:k,src:'day:'+k}));
  parts(e.words&&e.words.note).forEach(t=>{
    const [en,...r]=t.split(/\s+[-—–]\s+|\s*[—–:=]\s*/);
    S.words.push({en:en.trim(),ru:r.join(' — ').trim(),d:k,src:'day:'+k});
  });
  save();drawWords();drawMovies();stats();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addWord(){
  const en=$('wEn').value.trim(),ru=$('wRu').value.trim();
  if(!en)return;
  S.words.push({en,ru,d:today});
  const e=(S.days[today]=S.days[today]||{});e.words=e.words||{};e.words.on=true;
  save();$('wEn').value='';$('wRu').value='';$('wEn').focus();
  drawWords();stats();drawCal();if(sel===today)drawDay();
}
function addMovie(){
  const title=$('mTitle').value.trim(),d=$('mDate').value||today;
  if(!title)return;
  S.movies.push({title,d,src:'manual'});
  const e=(S.days[d]=S.days[d]||{});e.movies=e.movies||{};e.movies.on=true;
  save();$('mTitle').value='';$('mTitle').focus();
  drawMovies();stats();drawCal();drawDay();
}
$('mAdd').onclick=addMovie;
$('mTitle').onkeydown=e=>{if(e.key==='Enter')addMovie()};
$('mDate').value=today;
$('wAdd').onclick=addWord;
$('wRu').onkeydown=e=>{if(e.key==='Enter')addWord()};

$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);drawCal()};
$('next').onclick=()=>{view.setMonth(view.getMonth()+1);drawCal()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('calTab').hidden=t.dataset.tab!=='cal';$('wordsTab').hidden=t.dataset.tab!=='words';$('moviesTab').hidden=t.dataset.tab!=='movies';
});

$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='english-tracker-'+today+'.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const d=JSON.parse(t);S={days:d.days||{},words:d.words||[],movies:d.movies||[],dream:d.dream||S.dream,score:d.score||{},seeded:true,seedVer:d.seedVer||0,weekly:d.weekly};seedWords();weeklyWords();save();drawAll()}catch(x){alert('Не удалось прочитать файл')}});
};

      '<button class="btn ghost" id="trAgain">Ещё раз</button><button class="btn ghost" id="trMenu">К тренажёрам</button></div>';
  }else{
    const pr=T.mode==='pairs'?(T.batch*5+T.matched.size):T.idx+(T.done?1:0);
    h=`<div class="trhead"><button class="btn ghost" id="trMenu">← Выйти</button><span class="hint">Верно: ${T.ok} · Ошибок: ${T.bad} · ${pr} / ${T.queue.length}</span></div>`;
    const w=T.cur;
    if(T.mode==='cards'){
      h+=`<div class="fc ${T.flip?'back':''}" id="fc"><div>${esc(T.flip?back(w):front(w))}</div>${T.flip?'':'<small>нажми, чтобы перевернуть</small>'}</div>`+
        (T.flip?'<div class="trbtns"><button class="btn ghost" data-a="bad">Не знаю</button><button class="btn" data-a="ok">Знаю</button></div>':'');
    }else if(T.mode==='choice'){
      h+=`<div class="trq">${esc(front(w))}</div><div class="opts">`+T.opts.map((o,i)=>{
        const c=T.done?(o.en===w.en?' okopt':(i===T.picked?' badopt':'')):'';
        return `<button class="opt${c}" data-o="${i}" ${T.done?'disabled':''}>${esc(back(o))}</button>`}).join('')+'</div>'+
        (T.done?'<div class="trbtns" style="margin-top:14px"><button class="btn" id="trNext">Дальше</button></div>':'');
    }else if(T.mode==='type'){
      h+=`<div class="trq">${esc(front(w))}</div><div class="row"><input type="text" id="trIn" autocomplete="off" placeholder="${T.dir==='en'?'Перевод на русский':'По-английски'}" ${T.done?'disabled':''}><button class="btn" id="${T.done?'trNext':'trGo'}">${T.done?'Дальше':'Проверить'}</button></div>`+
        `<p style="text-align:center" class="${T.good?'okt':'badt'}">${T.done?(T.good?'✓ Верно':'✗ Правильно: '+esc(back(w))):''}</p>`;
    }else{
      const L=T.left.map((w,i)=>{const c=T.matched.has(w)?' okopt':(T.sel===i?' selopt':'');return `<button class="opt${c}" data-l="${i}" ${T.matched.has(w)?'disabled':''}>${esc(w.en)}</button>`}).join('');
      const R=T.right.map((w,j)=>{const c=T.matched.has(w)?' okopt':(T.flash===j?' badopt':'');return `<button class="opt${c}" data-r="${j}" ${T.matched.has(w)?'disabled':''}>${esc(w.ru)}</button>`}).join('');
      h+=`<div class="pairs"><div class="pcol">${L}</div><div class="pcol">${R}</div></div>`;
    }
  }
  el.innerHTML=h;
  const i=$('trIn');if(i){if(T.done)i.value=T.val;else i.focus()}
}
function checkAnswer(){
  const w=T.cur,v=$('trIn').value;if(!v.trim())return;
  T.good=T.dir==='en'?alts(w.ru).includes(norm(v)):normEn(v)===normEn(w.en);
  T.val=v;T.done=true;record(w,T.good);drawTrainer();
}
function pairClick(t){
  if(T.lock)return;
  if(t.dataset.l!==undefined){T.sel=+t.dataset.l;drawTrainer();return}
  if(T.sel<0)return;
  const lw=T.left[T.sel],j=+t.dataset.r,rw=T.right[j];
  if(lw===rw){
    T.matched.add(lw);if(!T.errw.has(lw))record(lw,true);T.sel=-1;
    if(T.matched.size===T.left.length){
      T.lock=true;drawTrainer();
      setTimeout(()=>{T.batch++;if(T.batch*5>=T.queue.length)T.view='result';else setupBatch();drawTrainer()},600);
      return;
    }
    drawTrainer();
  }else{
    if(!T.errw.has(lw)){T.errw.add(lw);record(lw,false)}
    T.flash=j;T.lock=true;drawTrainer();
    setTimeout(()=>{T.flash=-1;T.sel=-1;T.lock=false;drawTrainer()},600);
  }
}
$('trBody').addEventListener('click',e=>{
  const t=e.target.closest('button,.fc');if(!t)return;
  if(t.classList.contains('tile')){T.mode=t.dataset.mode;T.view='setup'}
  else if(t.id==='trMenu'){T.view='menu'}
  else if(t.dataset.n){T.n=t.dataset.n==='all'?pool().length:+t.dataset.n;startSession(pickSet(T.n));return}
  else if(t.id==='trAgain'){startSession(pickSet(T.n));return}
  else if(t.id==='trRetry'){startSession(T.wrong.slice());return}
  else if(t.id==='fc'||t.classList.contains('fc')){T.flip=!T.flip}
  else if(t.dataset.a){record(T.cur,t.dataset.a==='ok');advance()}
  else if(t.dataset.o!==undefined){T.picked=+t.dataset.o;T.done=true;T.good=T.opts[T.picked].en===T.cur.en;record(T.cur,T.good)}
  else if(t.id==='trGo'){checkAnswer();return}
  else if(t.id==='trNext'){advance()}
  else if(t.dataset.l!==undefined||t.dataset.r!==undefined){pairClick(t);return}
  else return;
  drawTrainer();
});
$('trBody').addEventListener('change',e=>{if(e.target.id==='trDir'){T.dir=e.target.value;drawTrainer()}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||$('wTrain').hidden||T.view!=='play')return;
  if(T.mode==='type'){if(!T.done&&e.target.id==='trIn')checkAnswer();else if(T.done){advance();drawTrainer()}}
  else if(T.mode==='choice'&&T.done){advance();drawTrainer()}
});
document.querySelectorAll('[data-wv]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-wv]').forEach(x=>x.classList.toggle('on',x===b));
  $('wDict').hidden=b.dataset.wv!=='dict';$('wTrain').hidden=b.dataset.wv!=='train';
  if(b.dataset.wv==='train'){T.view='menu';drawTrainer()}
});

/* ---------- напоминания (звук + уведомления; в программе на ПК приходят системные) ---------- */
const REMIND=['12:00','19:00','21:30'];
const pl=n=>{const a=n%10,b=n%100;return b>10&&b<15?'дней':a===1?'день':(a>1&&a<5)?'дня':'дней'};
function beep(strong){
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    (strong?[880,660,880,660,880]:[660,880]).forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.3;
      o.frequency.value=f;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.27);
      o.start(t);o.stop(t+.28);
    });
  }catch(e){}
}
function notify(title,body,strong){
  beep(strong);
  if(window.desktop){window.desktop.notify(title,body);return}
  if(!('Notification' in window))return;
  const show=()=>{try{new Notification(title,{body,silent:true})}catch(e){}};
  if(Notification.permission==='granted')show();
  else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')show()});
}
function remindText(){
  const m=getMissed();
  if(m>=2)return [`⚠ ${m} ${pl(m)} без английского`,m===2?'Сегодня третий день. Позанимайся хотя бы 15 минут.':'Лимит превышен. Позанимайся сегодня и верни ритм.',true];
  if(m===1)return ['Вчера не было занятий','Сегодня наверстай: 15 минут английского.',false];
  return ['English Tracker','Сегодня ещё нет занятий. 15 минут английского?',false];
}
function remind(launch){
  const now=new Date(),t=ymd(now);
  if(t!==today){today=t;view=new Date();view.setDate(1);sel=today;weeklyWords();drawAll()}
  if(isDone(today))return;
  const hm=pad(now.getHours())+':'+pad(now.getMinutes());
  let f={};try{f=JSON.parse(localStorage.getItem('english-tracker-fired')||'{}')}catch(e){}
  if(f.d!==today)f={d:today,s:[]};
  const due=REMIND.filter(x=>hm>=x&&!f.s.includes(x));
  const fire=due.length||(launch&&getMissed()>=1);
  due.forEach(x=>f.s.push(x));
  try{localStorage.setItem('english-tracker-fired',JSON.stringify(f))}catch(e){}
  if(fire){const [a,b,c]=remindText();notify(a,b,c)}
}
$('tst').onclick=()=>{const [a,b,c]=remindText();notify(a,b,c)};
setInterval(()=>remind(false),60000);
setTimeout(()=>remind(true),3000);

function drawAll(){drawNews();drawMovies();$('dText').value=S.dream.text;$('dDate').value=S.dream.date;stats();drawCal();drawDay();drawWords()}
seedWords();weeklyWords();drawAll();go();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
